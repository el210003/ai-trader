# ============================================================
# AI Trader configuration
# ============================================================

mt5:
  # Optional: full path to your MT5 terminal. Leave null to attach to any running terminal.
  terminal_path: null        # e.g. "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
  login: null                # integer account number, null = use already-logged-in terminal
  password: null
  server: null
  timeout: 60000

data:
  bars: 3000                 # history to pull per symbol/timeframe

symbols:
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD
  - USDCHF
  - USDCAD
  - NZDUSD

timeframes:
  - M15
  - H1
  - H4

# When `discover.enabled` is true, the CLI ignores the `symbols:` list above
# and queries MT5 at runtime for every symbol currently visible / tradeable
# in Market Watch.  You can also pass `--all-symbols` on any command to
# force discovery on the fly without editing this file.
#
# Group examples:
#   "*"        -> everything
#   "*USD*"    -> symbols whose name contains USD
#   "Forex\\*" -> everything under a "Forex" path
#   "Metals*"  -> gold / silver
discover:
  enabled: true
  group: "*"
  only_tradeable: true      # skip symbols whose trade_mode == DISABLED
  only_visible: true        # skip symbols not currently in Market Watch
  max_count: 200            # safety cap (some brokers expose thousands)
  cache_path: data/discovered_symbols.json  # persisted so the dashboard
                                            # can load without MT5 open

storage:
  path: data/trader.db

smc:
  swing_lookback: 3          # bars left/right for pivot detection
  eq_tolerance_pct: 0.0006   # tolerance (fraction of price) for equal highs/lows clustering
  ob_max_age_bars: 300       # max age of a fresh (unmitigated) order block
  fvg_max_age_bars: 200      # max age of a fresh (unfilled) fair value gap
  sweep_lookback_bars: 30    # a sweep within this many bars counts as "recent"
  min_rr: 1.5                # setups below this risk:reward are discarded
  default_rr: 2.0            # fallback RR when no liquidity target gives min_rr
  max_rr: 5.0
  sl_buffer_atr: 0.25        # stop-loss buffer beyond zone/sweep wick, in ATR units
  min_risk_atr: 0.75         # stop must be at least this far from entry (ATR units)
  max_entry_distance_atr: 1.0  # skip setups where price already ran this far past
                             # entry toward TP (they are look-back, not actionable)
  skip_already_tested: true  # skip setups whose entry zone was already retested
                             # since it formed (the fill opportunity is gone)
  retest_buffer_atr: 0.20    # a limit is 'filled' when price comes within this
                             # many ATRs of the entry (catches 1-3 pip near-misses)
  entry_valid_bars: 24       # expire a setup that hasn't filled within this many
                             # bars of its zone forming (kills stale late fills)
  atr_period: 14

ai:
  ml:
    model_path: data/models/setup_classifier.joblib
    label_horizon_bars: 96   # forward window to label TP-before-SL outcomes
    label_step: 4            # step between historical setup samples during training
    warmup_bars: 300         # history required before generating training setups
    min_train_samples: 60
    backend: sklearn         # sklearn (fastest at typical sizes) | xgboost
                             # xgboost uses CUDA on your RTX GPU but only wins
                             # at large row counts (100k+ blended outcomes)
    parallel: true           # replay symbols in parallel worker processes
    workers: 0               # 0 = auto (CPU cores - 1, capped at 8)
    live_outcomes:          # tier-3: blend resolved live outcomes into training
      enabled: true         # trains blended vs replay-only, keeps better cv_auc
      min_samples: 200      # do not blend below this many resolved live outcomes
    auto_retrain:            # model-drift safety net (see docs/ml-method.md)
      enabled: true
      max_age_days: 7        # model older than this is considered stale
      on_refresh: warn       # warn    = dashboard badge + Retrain button (manual click)
                             # auto    = stale model is retrained automatically on refresh
                             # manual  = no warning, retrain via CLI only
  llm:
    enabled: true
    # Any OpenAI-compatible endpoint works:
    #   OpenAI:    https://api.openai.com/v1        model: gpt-4o-mini
    #   Ollama:    http://localhost:11434/v1        model: llama3.1
    #   LM Studio: http://localhost:1234/v1         model: (loaded model)
    base_url: https://api.minimax.io/v1 
    api_key_env: MINIMAX_API_KEY
    model : MiniMax-M3
    temperature: 0.2
    timeout: 45
    # Speed controls for bar-close bursts (LLM calls only happen for setups
    # whose ML win-probability clears the gate; identical setups within the TTL
    # reuse the cached narrative instead of re-spending tokens):
    min_ml_prob: 0.30        # skip LLM when ML win-probability < 30%
    cache_ttl: 900           # reuse cached LLM narrative for 15 min
  hybrid:
    ml_weight: 0.6           # weight of ML win-probability in final score
    llm_weight: 0.4          # weight of LLM confidence in final score
    buy_threshold: 60        # final score needed to emit BUY/SELL (else WAIT)

# Currency Strength Meter (CSM28 port): z-scores over the 28 standard pairs,
# averaged per currency (base +1 / quote -1), smoothed. The engine auto-ingests
# the 28 pairs for every configured timeframe and stores snapshots (which also
# power the MTF-alignment transitions feed).
csm:
  enabled: true
  lookback: 20              # z-score window
  ma_length: 10             # smoothing length
  ma_type: SMA              # SMA | EMA
  display: MA               # MA (absolute strength) | ROC (momentum change)
  roc_len: 1                # ROC length when display is ROC
  bars: 400                 # history pulled per CSM pair
  min_pairs: 10             # skip computation if fewer pairs available
  min_interval_seconds: 30  # throttle between snapshot refreshes

# Multi-timeframe confluence: higher timeframes (H1/H4 for M15 entries) are
# projected into every setup as bias/zone/PD/liquidity confluence + ML features.
# NOTE: the execution engine only trades setups on `mtf.entry_tf` (below).
mtf:
  enabled: true
  require_htf_bias: false   # true = drop M15 setups whose nearest HTF (H1) trend opposes
  zone_buffer_atr: 0.5      # M15-zone proximity to an HTF OB/FVG, in entry-TF ATRs
  entry_tf: M15             # the ONLY timeframe that generates trade setups;
                            # other configured TFs are analyzed as context only
                            # (charts, HTF confluence) and generate no setups.
                            # empty = all timeframes generate setups

# Outcome tracking: every journaled setup is resolved against subsequent
# candles (WIN/LOSS/EXPIRED, same conservative rules as the ML labeler).
# Results feed the Journal badges, the Performance tab, and the live
# per-symbol ML features. Runs after each analysis cycle.
outcomes:
  enabled: true             # reserved flag (resolution is cheap & idempotent)
  lookback_days: 30         # only resolve setups formed within this window

# ============================================================
# LIVE EXECUTION — place MT5 orders when a setup qualifies
# ============================================================
# The engine scans fresh analyses for setups whose hybrid verdict is BUY or
# SELL and sends the matching order with the setup's SL/TP attached.
#
# SAFETY: it starts OFF and in DRY-RUN. Recommended rollout:
#   1. dry_run: true, enabled: true   -> watch the Trade tab log orders
#   2. dry_run: false                 -> LIVE, tiny risk_percent first
# Every attempt is logged to the `trades` table + dashboard Trade tab.
# The bot only ever touches orders tagged with its `magic` number.
execution:
  enabled: false             # master switch (or toggle live from the Trade tab)
  dry_run: true              # true = log what WOULD be sent, no orders go out
  magic: 862001              # unique id tagging every bot order (change if you run two bots)
  entry_type: market         # market = instant fill at ask/bid
                             # limit = pending order parked at the setup's zone entry
                             #        (auto-fallback to market when the zone is at price)
  deviation: 20              # max slippage for market orders, in points
  risk_percent: 1.0          # % of balance risked per trade, sized from the SL distance
  fixed_lot: null            # set e.g. 0.10 to bypass risk-percent sizing
  allow_min_lot: false       # false = skip when the sized lot is below the broker minimum
  min_score: 70              # hybrid final score required (dashboard threshold is 60)
  min_ml_prob: 0.50          # ML win probability required (setup skipped below this)
  max_open_positions: 3      # total open bot positions + pending orders
  max_per_symbol: 1          # open bot positions + pendings per symbol
  max_trades_per_day: 5      # daily cap (resets at local midnight)
  cooldown_minutes: 240      # after a trade, this symbol+direction is paused
  fresh_seconds: 120         # only setups from analyses newer than this are considered
                             # (keeps a restart from firing stale setups)
  max_spread_points: 40      # skip when ask-bid spread is wider than this (points)
  trading_hours: null        # "07-20" = trade only in that broker-server hour window
  pending_expiry_minutes: 240 # limit orders older than this are canceled by the engine
  poll_seconds: 15           # how often the execution engine scans for fresh setups
  comment: ai-trader         # order comment visible in MT5

dashboard:
  debug: true               # verbose console output — shows exactly what each
                            # analysis cycle / retrain / bar-close is doing
  log_file: logs/ai-trader.log   # ALL console output is mirrored here (rotated)
  parallel_analysis: true   # analyze bar-close pairs in parallel worker processes
  analysis_workers: 0       # 0 = auto (CPU cores - 1, capped at 8)
  host: 0.0.0.0
  port: 8000
  refresh_seconds: 60        # auto-refresh interval in the web UI (view only)
  # Auto-pipeline: run the FULL ingest+analyze cycle from MT5 every N seconds
  # while serve is open (0 = off; then only "Run analysis" clicks pull data).
  # Example: 900 = every 15 min. CLI shortcut:  serve.bat --auto 900
  auto_run_interval: 0
  # Bar-close watcher (RECOMMENDED over the timer): polls MT5 cheaply and
  # analyzes each pair the moment its bar CLOSES, using only confirmed bars
  # (matches how the ML model was trained). Overrides auto_run_interval.
  # CLI shortcut:  serve.bat --on-bar-close
  bar_close_watcher: true
  bar_poll_seconds: 10       # how often to peek MT5 for a new bar
